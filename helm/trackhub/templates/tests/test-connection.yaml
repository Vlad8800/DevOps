apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "trackhub.fullname" . }}-test-connection"
  labels:
    {{- include "trackhub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "trackhub.fullname" . }}:{{ .Values.service.port }}/health', '-q', '-O', '-']
  restartPolicy: Never