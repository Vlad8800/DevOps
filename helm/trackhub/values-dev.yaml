replicaCount: 1

image:
  tag: "1.0.0"

service:
  type: NodePort
  nodePort: 30080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

config:
  appEnv: "development"
  defaultPriority: "low"

secrets:
  databaseUrl: "sqlite:///./dev.db"
  apiSecretKey: "dev-secret-key-123"

ingress:
  enabled: false