# Managed by trackhub-root. Do not apply this file manually.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trackhub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vlad8800/DevOps.git
    targetRevision: main
    path: charts/trackhub
    helm:
      releaseName: trackhub
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: trackhub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
