# GitOps settings for the local minikube cluster.
# Change image.tag only after that exact tag is published to GHCR.
replicaCount: 5

image:
  repository: ghcr.io/vlad8800/devops
  tag: "1.2.1"
  pullPolicy: Always

service:
  type: NodePort
  nodePort: 30080

config:
  appEnv: "development"
  defaultPriority: "hight"
  databaseUrl: "sqlite:///./dev.db"

ingress:
  enabled: false

rollout:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}
