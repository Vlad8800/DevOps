# GitOps settings for the local minikube cluster.
# Change image.tag only after that exact tag is published to GHCR.
replicaCount: 1
progressDeadlineSeconds: 90

image:
  repository: ghcr.io/vlad8800/devops
  tag: "1.2.1"
  pullPolicy: Always

service:
  type: NodePort
  nodePort: 30080

config:
  appEnv: "development"
  defaultPriority: "low"
  databaseUrl: "sqlite:///./dev.db"

ingress:
  enabled: false

# Deliberately wrong for the Lab 5 health-check demonstration; revert this commit afterward.
probes:
  readiness:
    port: 9999
