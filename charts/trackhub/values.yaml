replicaCount: 1

image:
  repository: ghcr.io/vlad8800/devops
  pullPolicy: IfNotPresent
  tag: "1.2.1"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: trackhub.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi

config:
  appEnv: "development"
  defaultPriority: "low"
  databaseUrl: "sqlite:///./dev.db"
  failRate: 0

monitoring:
  enabled: false
  prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
  analysis:
    interval: 30s
    count: 3
    failureLimit: 0
    successThreshold: 0.95

secrets:
  existingSecret: ""

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
rollout:
  enabled: false
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
