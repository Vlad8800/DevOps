{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "trackhub.fullname" . }}
  labels:
    {{- include "trackhub.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "trackhub.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podTargetLabels:
    - rollouts-pod-template-hash
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
